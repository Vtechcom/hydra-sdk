server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Prerendered routes are directories (`/transaction-builder/index.html`), so
	# nginx 301s `/transaction-builder` → `/transaction-builder/`. Behind a
	# published container port it builds that Location from its own :80 and drops
	# the host port, sending browsers to the wrong place. Relative redirects
	# sidestep the whole problem.
	absolute_redirect off;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm;

	# nginx's `add_header` does NOT merge with the parent scope — a location that
	# sets any header drops every inherited one. Hence the repetition below: the
	# security headers have to be restated in each location that adds a header.

	# HTML and unhashed public assets. Nuxt prerenders every crawled route to a
	# real .html file; 200.html is the fallback for anything it did not crawl,
	# since the app is ssr: false. Never cached, or a deploy strands clients on
	# stale asset hashes.
	location / {
		try_files $uri $uri/ $uri.html /200.html;

		# `expires -1` already emits Cache-Control: no-cache; adding it by hand
		# would send the header twice.
		expires -1;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	}

	# The SDK loads cardano-serialization-lib through WebAssembly.instantiateStreaming,
	# which rejects any response that is not `application/wasm`. `types { }` empties
	# the map for this location only, so the global mime.types stays intact.
	location ~* \.wasm$ {
		types { }
		default_type application/wasm;

		add_header Cache-Control "public, max-age=31536000, immutable" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	}

	# Hashed build assets: the same name always means the same bytes.
	location /_nuxt/ {
		try_files $uri =404;

		add_header Cache-Control "public, max-age=31536000, immutable" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	}

	error_page 404 /404.html;
}
