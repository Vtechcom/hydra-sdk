<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hydra SDK · Architecture map</title>

<style>
	/* ─────────────────────────────────────────────────────────────
	   Tokens. Colour encodes tier, not decoration:
	   slate = consumers, teal = SDK, violet = WASM, bronze = network.
	   ───────────────────────────────────────────────────────────── */
	:root {
		--serif: 'Iowan Old Style', 'Charter', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
		--sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
		--mono: ui-monospace, 'SF Mono', SFMono-Regular, 'JetBrains Mono', 'IBM Plex Mono', Menlo, Consolas, monospace;

		--ground: #090E14;
		--stage: #0D141C;
		--surface: #121B24;
		--panel: #111A23;
		--raise: #18232F;
		--hair: #22303E;
		--hair-soft: #1A2531;

		--fg: #DFE7EF;
		--fg-2: #93A6B8;
		--fg-3: #62778B;

		--edge: #2C3F51;
		--edge-hot: #5FF0DC;

		--slate: #8FA6BE;
		--teal: #35D6C6;
		--violet: #9B8CFF;
		--bronze: #E0A458;

		--focus: #5FF0DC;
		--radius: 9px;
		--rail-w: 404px;
	}

	@media (prefers-color-scheme: light) {
		:root {
			--ground: #E7EDF2;
			--stage: #F2F6F9;
			--surface: #FFFFFF;
			--panel: #E4ECF2;
			--raise: #FFFFFF;
			--hair: #C6D5E1;
			--hair-soft: #DFE8EF;

			--fg: #0D1720;
			--fg-2: #485B6C;
			--fg-3: #74889A;

			--edge: #AFC1D0;
			--edge-hot: #0A9A8A;

			--slate: #4C6379;
			--teal: #0C8577;
			--violet: #5B45C9;
			--bronze: #96601A;

			--focus: #0A9A8A;
		}
	}

	:root[data-theme='dark'] {
		--ground: #090E14;
		--stage: #0D141C;
		--surface: #121B24;
		--panel: #111A23;
		--raise: #18232F;
		--hair: #22303E;
		--hair-soft: #1A2531;
		--fg: #DFE7EF;
		--fg-2: #93A6B8;
		--fg-3: #62778B;
		--edge: #2C3F51;
		--edge-hot: #5FF0DC;
		--slate: #8FA6BE;
		--teal: #35D6C6;
		--violet: #9B8CFF;
		--bronze: #E0A458;
		--focus: #5FF0DC;
	}

	:root[data-theme='light'] {
		--ground: #E7EDF2;
		--stage: #F2F6F9;
		--surface: #FFFFFF;
		--panel: #E4ECF2;
		--raise: #FFFFFF;
		--hair: #C6D5E1;
		--hair-soft: #DFE8EF;
		--fg: #0D1720;
		--fg-2: #485B6C;
		--fg-3: #74889A;
		--edge: #AFC1D0;
		--edge-hot: #0A9A8A;
		--slate: #4C6379;
		--teal: #0C8577;
		--violet: #5B45C9;
		--bronze: #96601A;
		--focus: #0A9A8A;
	}

	* { box-sizing: border-box; }

	body {
		margin: 0;
		background: var(--ground);
		color: var(--fg);
		font-family: var(--sans);
		font-size: 14px;
		line-height: 1.5;
		-webkit-font-smoothing: antialiased;
		overflow: hidden;
	}

	button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
	:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

	.shell { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

	/* ── Top bar ─────────────────────────────────────────────── */
	.topbar {
		display: flex; align-items: center; gap: 20px;
		padding: 14px 20px; border-bottom: 1px solid var(--hair);
		background: var(--stage); flex: none;
	}
	.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
	.brand h1 {
		margin: 0; font-family: var(--serif); font-weight: 600;
		font-size: 21px; letter-spacing: -0.01em; white-space: nowrap;
	}
	.brand .sub {
		font-family: var(--mono); font-size: 11px; color: var(--fg-3);
		letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
	}
	.chips { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
	.chip {
		font-family: var(--mono); font-size: 10.5px; color: var(--fg-2);
		border: 1px solid var(--hair); border-radius: 999px; padding: 3px 9px;
		white-space: nowrap; font-variant-numeric: tabular-nums;
	}
	.chip b { color: var(--teal); font-weight: 600; }
	.theme-btn {
		flex: none; width: 32px; height: 32px; border: 1px solid var(--hair);
		border-radius: 8px; display: grid; place-items: center; color: var(--fg-2);
	}
	.theme-btn:hover { color: var(--fg); border-color: var(--fg-3); }

	/* ── Body grid ───────────────────────────────────────────── */
	.body {
		flex: 1; min-height: 0;
		display: grid; grid-template-columns: minmax(0, 1fr) var(--rail-w);
	}

	/* ── Stage ───────────────────────────────────────────────── */
	.stage { position: relative; min-width: 0; background: var(--stage); overflow: hidden; }

	.viewport { position: absolute; inset: 0; cursor: grab; touch-action: none; }
	.viewport.dragging { cursor: grabbing; }

	.world {
		position: absolute; top: 0; left: 0;
		transform-origin: 0 0;
		background-image: radial-gradient(circle at 1px 1px, var(--hair-soft) 1px, transparent 0);
		background-size: 28px 28px;
	}

	.wires { position: absolute; top: 0; left: 0; overflow: visible; }
	.nodes { position: absolute; top: 0; left: 0; }

	/* group panels */
	.grp rect { fill: var(--panel); stroke: var(--hair); stroke-width: 1; opacity: 0.88; }
	.grp .grp-label {
		font-family: var(--mono); font-size: 11px; font-weight: 600;
		fill: var(--fg-2); letter-spacing: 0.04em;
	}
	.grp .grp-ver { font-family: var(--mono); font-size: 10px; fill: var(--fg-3); }
	.grp.t-wasm .grp-label { fill: var(--violet); }
	.grp.t-remote .grp-label { fill: var(--bronze); }
	.grp.t-infra rect { stroke-dasharray: 4 4; }
	.grp.t-infra .grp-label { fill: var(--bronze); }
	.grp.t-app .grp-label { fill: var(--slate); }
	.grp.t-sdk .grp-label { fill: var(--teal); }

	/* edges */
	.edge { fill: none; stroke: var(--edge); stroke-width: 1.15px; }
	.edge.k-net { stroke-dasharray: 5 4; }
	.edge.k-host { stroke-dasharray: 2 4; }
	.edge.k-event { stroke-dasharray: 1 3; stroke-linecap: round; }
	.edge.hovered { stroke: var(--fg-2); stroke-width: 1.8px; }
	.elabel {
		font-family: var(--mono); font-size: 9.5px; fill: var(--fg-2);
		text-anchor: middle; opacity: 0; pointer-events: none;
		paint-order: stroke; stroke: var(--stage); stroke-width: 4px; stroke-linejoin: round;
	}
	.elabel.shown { opacity: 1; }
	.mk path { fill: var(--edge); }
	.mk-hot path { fill: var(--edge-hot); }

	/* nodes */
	.node {
		position: absolute; display: flex; align-items: center; gap: 0;
		padding: 0; text-align: left;
		background: var(--raise); border: 1px solid var(--hair);
		border-radius: var(--radius);
		transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
	}
	.node:hover { transform: translateY(-1px); border-color: var(--tier); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28); }
	.node .stripe {
		flex: none; width: 3px; align-self: stretch; background: var(--tier);
		opacity: 0.8; border-radius: var(--radius) 0 0 var(--radius);
	}
	.node .txt { padding: 0 11px; min-width: 0; flex: 1; overflow: hidden; }
	.node .lbl {
		display: block; font-family: var(--mono); font-size: 12px; font-weight: 600;
		color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
	}
	.node .sub {
		display: block; font-size: 10.5px; color: var(--fg-3); margin-top: 1px;
		white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
	}
	.node.t-app { --tier: var(--slate); }
	.node.t-sdk { --tier: var(--teal); }
	.node.t-wasm { --tier: var(--violet); }
	.node.t-remote { --tier: var(--bronze); }
	.node.t-infra { --tier: var(--bronze); border-style: dashed; }

	.node .badge {
		position: absolute; top: -8px; right: -8px; min-width: 20px; height: 20px;
		padding: 0 6px; border-radius: 999px; display: none; place-items: center;
		font-family: var(--mono); font-size: 10.5px; font-weight: 700;
		font-variant-numeric: tabular-nums;
		background: var(--edge-hot); color: var(--ground);
		box-shadow: 0 0 0 3px var(--stage);
	}

	/* flow-active dimming: the whole map recedes, the path stays lit */
	.stage.flowing .node { opacity: 0.13; filter: saturate(0.25); }
	.stage.flowing .grp { opacity: 0.3; }
	.stage.flowing .edge { opacity: 0.06; }
	.stage.flowing .node,
	.stage.flowing .edge,
	.stage.flowing .grp { transition: opacity 0.25s ease, filter 0.25s ease; }

	.stage.flowing .node.on { opacity: 1; filter: none; border-color: var(--tier); }
	/* A node the path passes through but does not stop at: lit, but quieter. */
	.stage.flowing .node.on.transit { opacity: 0.62; }
	.stage.flowing .node.on .badge { display: grid; }
	.stage.flowing .node.on .badge:empty { display: none; }
	.stage.flowing .edge.on {
		opacity: 1; stroke: var(--edge-hot); stroke-width: 2px;
		stroke-dasharray: 7 6; animation: crawl 0.9s linear infinite;
		filter: drop-shadow(0 0 5px color-mix(in srgb, var(--edge-hot) 55%, transparent));
	}
	@keyframes crawl { to { stroke-dashoffset: -26; } }

	.stage.flowing .node.cur {
		box-shadow: 0 0 0 2px var(--edge-hot), 0 10px 26px rgba(0, 0, 0, 0.4);
		transform: translateY(-2px);
	}
	.stage.flowing .node.cur .badge { background: var(--fg); color: var(--ground); }

	/* stage furniture */
	.stage-tools {
		position: absolute; left: 16px; bottom: 16px; z-index: 4;
		display: flex; gap: 8px; align-items: flex-end;
	}
	.zoom {
		display: flex; background: var(--surface); border: 1px solid var(--hair);
		border-radius: 8px; overflow: hidden;
	}
	.zoom button {
		width: 34px; height: 32px; color: var(--fg-2); font-size: 15px;
		display: grid; place-items: center;
	}
	.zoom button + button { border-left: 1px solid var(--hair); }
	.zoom button:hover { background: var(--raise); color: var(--fg); }
	.zoom .fit { width: auto; padding: 0 12px; font-family: var(--mono); font-size: 11px; }

	.legend {
		background: var(--surface); border: 1px solid var(--hair); border-radius: 8px;
		padding: 9px 12px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
	}
	.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--fg-2); white-space: nowrap; }
	.legend i { width: 9px; height: 9px; border-radius: 3px; flex: none; }

	.stage-note {
		position: absolute; right: 16px; top: 14px; z-index: 4;
		font-family: var(--mono); font-size: 10.5px; color: var(--fg-3);
		background: color-mix(in srgb, var(--stage) 82%, transparent);
		border: 1px solid var(--hair-soft); border-radius: 7px; padding: 5px 10px;
		pointer-events: none;
	}

	/* ── Tooltip ─────────────────────────────────────────────── */
	.tip {
		position: fixed; z-index: 60; width: 320px; max-width: calc(100vw - 24px);
		background: var(--surface); border: 1px solid var(--hair);
		border-radius: 10px; padding: 13px 15px;
		box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
		opacity: 0; visibility: hidden; transform: translateY(4px);
		transition: opacity 0.12s ease, transform 0.12s ease, visibility 0.12s;
		pointer-events: none;
	}
	.tip.on { opacity: 1; visibility: visible; transform: none; }
	.tip .tip-top { display: flex; align-items: baseline; gap: 8px; }
	.tip h4 { margin: 0; font-family: var(--mono); font-size: 13px; font-weight: 700; }
	.tip .tier {
		font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em;
		text-transform: uppercase; color: var(--tier); margin-left: auto;
	}
	.tip .path {
		display: block; font-family: var(--mono); font-size: 10.5px; color: var(--fg-3);
		margin: 5px 0 8px; word-break: break-all;
	}
	.tip p { margin: 0; font-size: 12.5px; color: var(--fg-2); line-height: 1.55; }
	.tip ul {
		margin: 10px 0 0; padding: 9px 0 0; list-style: none;
		border-top: 1px solid var(--hair-soft);
		display: flex; flex-wrap: wrap; gap: 4px 6px;
	}
	.tip li {
		font-family: var(--mono); font-size: 10px; color: var(--fg-2);
		background: var(--raise); border: 1px solid var(--hair-soft);
		border-radius: 5px; padding: 2px 6px;
	}
	.tip .inflows {
		margin-top: 10px; font-size: 11px; color: var(--fg-3);
	}
	.tip .inflows b { color: var(--tier); font-weight: 600; }

	/* ── Rail ────────────────────────────────────────────────── */
	.rail {
		border-left: 1px solid var(--hair); background: var(--surface);
		display: flex; flex-direction: column; min-height: 0; min-width: 0;
	}
	.rail-scroll { overflow-y: auto; overscroll-behavior: contain; flex: 1; min-height: 0; }

	.eyebrow {
		font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
		text-transform: uppercase; color: var(--fg-3);
	}

	.overview { padding: 20px 20px 4px; border-bottom: 1px solid var(--hair); }
	.overview p { margin: 9px 0 0; font-size: 12.5px; color: var(--fg-2); line-height: 1.6; max-width: 60ch; }
	.stats { display: flex; gap: 20px; margin: 16px 0 18px; }
	.stat { display: flex; flex-direction: column; }
	.stat b {
		font-family: var(--serif); font-size: 24px; font-weight: 600;
		line-height: 1; font-variant-numeric: tabular-nums;
	}
	.stat span { font-size: 10.5px; color: var(--fg-3); margin-top: 4px; }

	.flow-head {
		padding: 16px 20px 10px; display: flex; align-items: baseline; gap: 8px;
		position: sticky; top: 0; background: var(--surface); z-index: 2;
		border-bottom: 1px solid var(--hair-soft);
	}
	.cat-head {
		padding: 16px 20px 6px; font-family: var(--mono); font-size: 10px;
		letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3);
	}
	.flow-list { padding: 0 12px 24px; display: flex; flex-direction: column; gap: 4px; }
	.flow-card {
		display: block; width: 100%; text-align: left; padding: 11px 12px;
		border-radius: 9px; border: 1px solid transparent;
		transition: background 0.12s ease, border-color 0.12s ease;
	}
	.flow-card:hover { background: var(--raise); border-color: var(--hair); }
	.flow-card .fname {
		display: block; font-family: var(--serif); font-size: 15.5px;
		font-weight: 600; letter-spacing: -0.005em;
	}
	.flow-card .ftag { display: block; font-size: 12px; color: var(--fg-2); margin-top: 3px; line-height: 1.45; }
	.flow-card .fmeta {
		display: block; font-family: var(--mono); font-size: 10px; color: var(--fg-3);
		margin-top: 6px; letter-spacing: 0.04em;
	}

	/* flow detail */
	.detail { display: flex; flex-direction: column; min-height: 0; flex: 1; }
	.detail-head { padding: 14px 20px 16px; border-bottom: 1px solid var(--hair); }
	.back {
		display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono);
		font-size: 11px; color: var(--fg-2); padding: 4px 8px 4px 4px; border-radius: 6px;
		margin-bottom: 10px;
	}
	.back:hover { color: var(--fg); background: var(--raise); }
	.detail-head h2 {
		margin: 0; font-family: var(--serif); font-size: 22px; font-weight: 600;
		letter-spacing: -0.012em; text-wrap: balance;
	}
	.detail-head .ftag { margin: 6px 0 0; font-size: 12.5px; color: var(--fg-2); max-width: 58ch; }

	.stepper {
		display: flex; align-items: center; gap: 8px; margin-top: 14px;
	}
	.stepper .count {
		font-family: var(--mono); font-size: 11px; color: var(--fg-2);
		font-variant-numeric: tabular-nums; margin-right: auto;
	}
	.stepper button {
		width: 30px; height: 28px; border: 1px solid var(--hair); border-radius: 7px;
		color: var(--fg-2); display: grid; place-items: center;
	}
	.stepper button:hover:not(:disabled) { color: var(--fg); border-color: var(--fg-3); background: var(--raise); }
	.stepper button:disabled { opacity: 0.35; cursor: default; }

	.steps { list-style: none; margin: 0; padding: 8px 12px 28px; counter-reset: s; }
	.step-item { position: relative; }
	.step-btn {
		display: grid; grid-template-columns: 26px 1fr; gap: 10px; width: 100%;
		text-align: left; padding: 10px 10px 12px; border-radius: 9px;
		border: 1px solid transparent;
	}
	.step-btn:hover { background: var(--raise); }
	.step-item.cur .step-btn { background: var(--raise); border-color: var(--tier); }
	.step-num {
		grid-row: 1 / span 3; width: 24px; height: 24px; border-radius: 999px;
		display: grid; place-items: center; font-family: var(--mono); font-size: 11px;
		font-weight: 700; font-variant-numeric: tabular-nums;
		border: 1px solid var(--hair); color: var(--fg-3); margin-top: 1px;
	}
	.step-item.cur .step-num { background: var(--tier); border-color: var(--tier); color: var(--ground); }
	.step-node {
		display: block; font-family: var(--mono); font-size: 10.5px;
		color: var(--tier); letter-spacing: 0.03em;
	}
	.step-title { display: block; font-size: 13.5px; font-weight: 600; margin-top: 1px; text-wrap: balance; }
	.step-note { display: block; font-size: 12.5px; color: var(--fg-2); margin-top: 4px; line-height: 1.55; }
	.step-item::after {
		content: ''; position: absolute; left: 22px; top: 42px; bottom: 2px;
		width: 1px; background: var(--hair);
	}
	.step-item:last-child::after { display: none; }

	.t-app { --tier: var(--slate); }
	.t-sdk { --tier: var(--teal); }
	.t-wasm { --tier: var(--violet); }
	.t-remote { --tier: var(--bronze); }
	.t-infra { --tier: var(--bronze); }

	.hint {
		padding: 0 20px 20px; font-size: 11.5px; color: var(--fg-3); line-height: 1.55;
	}
	.hint kbd {
		font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--hair);
		border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--fg-2);
	}

	/* ── Responsive ──────────────────────────────────────────── */
	@media (max-width: 1080px) {
		body { overflow: auto; }
		.shell { height: auto; min-height: 100vh; }
		.body { grid-template-columns: 1fr; }
		.stage { height: 60vh; min-height: 380px; }
		.rail { border-left: none; border-top: 1px solid var(--hair); }
		.rail-scroll { overflow: visible; }
		.topbar { flex-wrap: wrap; gap: 10px 16px; }
		.chips { margin-left: 0; justify-content: flex-start; }
	}
	@media (max-width: 560px) {
		.brand h1 { font-size: 18px; }
		.brand .sub { display: none; }
		.tip { width: calc(100vw - 24px); }
		.legend { display: none; }
	}

	@media (prefers-reduced-motion: reduce) {
		*, *::before, *::after {
			animation-duration: 0.001ms !important; animation-iteration-count: 1 !important;
			transition-duration: 0.001ms !important;
		}
	}
</style>

<div class="shell">
	<header class="topbar">
		<div class="brand">
			<h1>Hydra SDK</h1>
			<span class="sub">architecture &amp; flow map</span>
		</div>
		<div class="chips" id="chips"></div>
		<button class="theme-btn" id="themeBtn" type="button" aria-label="Switch colour theme" title="Switch colour theme">
			<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
				<path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Zm0 1.6v10.8a5.4 5.4 0 0 1 0-10.8Z" />
			</svg>
		</button>
	</header>

	<div class="body">
		<section class="stage" id="stage">
			<div class="viewport" id="viewport">
				<div class="world" id="world">
					<svg class="wires" id="wires" aria-hidden="true">
						<defs>
							<marker id="ar" class="mk" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
								<path d="M0 1 L7 4 L0 7 z" />
							</marker>
							<marker id="ar-hot" class="mk mk-hot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
								<path d="M0 1 L7 4 L0 7 z" />
							</marker>
						</defs>
						<g id="layerGroups"></g>
						<g id="layerEdges"></g>

	"flows": [
		{
			"id": "wallet-from-mnemonic",
			"name": "Create a wallet from a mnemonic",
			"tagline": "Twenty-four words become an account, three addresses and a signing key.",
			"category": "keys",
			"edges": ["app-consumer>app-wallet", "app-wallet>embedded-wallet", "embedded-wallet>build-keys", "build-keys>wasm-entry", "wasm-entry>csl-browser"],
			"steps": [
				{ "node": "app-consumer", "title": "Construct the wallet", "note": "new AppWallet({ networkId, key: { type: 'mnemonic', words } }). The same constructor also takes a root bech32 key or a pair of cardano-cli keys." },
				{ "node": "app-wallet", "title": "Pick the key strategy", "note": "The constructor switches on key.type and hands the material to the embedded layer. Nothing is derived yet." },
				{ "node": "embedded-wallet", "title": "Mnemonic → root private key", "note": "WalletStaticMethods.mnemonicToPrivateKeyHex runs BIP39 entropy through Bip32PrivateKey.from_bip39_entropy with the supplied password." },
				{ "node": "build-keys", "title": "Derive the account", "note": "buildKeys walks m/1852'/1815'/account'/role/index and returns the payment key, stake key and the base, enterprise and reward addresses in one object." },
				{ "node": "wasm-entry", "title": "Cross the WASM boundary", "note": "Bip32PrivateKey, Credential and BaseAddress are CSL types; this is the only module that imports them." },
				{ "node": "csl-browser", "title": "Resolve the right build", "note": "The bundler's browser condition selects the browser WASM build. In Node the node condition wins instead — no runtime branch is involved." }
			]
		},
		{
			"id": "l1-transaction",
			"name": "Build, sign and submit on L1",
			"tagline": "The ordinary Cardano path, from UTxO query to transaction id.",
			"category": "transaction",
			"edges": ["app-consumer>app-wallet", "app-wallet>providers", "providers>blockfrost", "app-consumer>txbuilder", "txbuilder>protocol-params", "txbuilder>wasm-entry", "txbuilder>resolver", "app-wallet>embedded-wallet", "blockfrost>cardano-l1"],
			"steps": [
				{ "node": "app-consumer", "title": "Start from the wallet", "note": "One AppWallet carries the key, the fetcher and the submitter, so querying, signing and submitting all go through it." },
				{ "node": "app-wallet", "title": "Query spendable UTxOs", "note": "queryUTxOs(address) throws unless a fetcher was supplied — the wallet never invents chain access." },
				{ "node": "providers", "title": "Reach the chain", "note": "BlockfrostProvider satisfies both IFetcher and ISubmitter, so a single object covers reads and writes." },
				{ "node": "blockfrost", "title": "Fetch and normalise", "note": "GET /addresses/{address}/utxos is paged until exhausted, then each entry is mapped into the SDK's UTxO shape." },
				{ "node": "txbuilder", "title": "Stage the transaction", "note": "setInputs(utxos) → txOut(address, amount) → changeAddress(addr) → complete(). Every call stages a descriptor; nothing touches CSL yet." },
				{ "node": "protocol-params", "title": "Size the fee", "note": "minFeeA, minFeeB, coinsPerUtxoSize and the cost models come from the protocol parameters passed to the builder." },
				{ "node": "wasm-entry", "title": "Assemble and build", "note": "_assembleAndBuild pours the staged parts into CSL's TransactionBuilder and calls add_change_if_needed, then build_tx." },
				{ "node": "resolver", "title": "Learn the transaction id", "note": "resolveTxHash(cborHex) gives the id before submission — worth recording, because that is the key every later event uses." },
				{ "node": "app-wallet", "title": "Sign", "note": "signTx builds a Vkeywitness through EmbeddedWallet and re-attaches it to the FixedTransaction, preserving the original body bytes." },
				{ "node": "blockfrost", "title": "Submit", "note": "POST /tx/submit returns the transaction id the node accepted. Compare it with step 8 as a cheap sanity check." },
				{ "node": "cardano-l1", "title": "Settle", "note": "The transaction is in the mempool; confirmation follows chain timing, not SDK timing." }
			]
		},
		{
			"id": "connect-head",
			"name": "Connect to a Hydra head",
			"tagline": "One URL, a socket, and the Greetings message that seeds everything.",
			"category": "lifecycle",
			"edges": ["app-consumer>bridge-core", "bridge-core>ws-connector", "ws-connector>hydra-ws", "ws-connector>payload-types", "ws-connector>event-bus", "bridge-core>snapshot-cache", "ws-connector>hydra-rest", "infra-offline>hydra-ws"],
			"steps": [
				{ "node": "app-consumer", "title": "Open the bridge", "note": "new HydraBridge({ url: 'ws://localhost:4001', history: false }) — or pass your own connector instead of a url." },
				{ "node": "bridge-core", "title": "Wire the listeners", "note": "The constructor subscribes to onConnected and onMessage before the socket opens, so no Greetings can be missed." },
				{ "node": "ws-connector", "title": "Split the URL", "note": "parseUrl produces both a socket URL and an HTTP base URL from the one input, and appends history, snapshot-utxo and address query params." },
				{ "node": "hydra-ws", "title": "Socket opens", "note": "The node sends Greetings immediately. Unlike every other server output it carries no seq or timestamp, and its env deliberately omits the signing key." },
				{ "node": "payload-types", "title": "Narrow the payload", "note": "Raw JSON is narrowed to the HydraPayload union by its tag; InvalidInput is reshaped because the node sends it without one." },
				{ "node": "event-bus", "title": "Emit", "note": "onConnected fires first, then onMessage for every payload. bridge.events is this emitter." },
				{ "node": "snapshot-cache", "title": "Seed the state", "note": "Greetings sets nodeVersion, syncedStatus and an approximate slotZeroTimestamp, superseded later by an exact chainSlot/chainTime pair." },
				{ "node": "hydra-rest", "title": "Cold-start fallback", "note": "querySnapshotUtxo() runs GET /snapshot/utxo in the background and is discarded if a WebSocket snapshot arrived first — lastSnapshotNumber decides." },
				{ "node": "infra-offline", "title": "Where to try it", "note": "pnpm hydra:offline brings up a seeded offline node on :4002 with no L1 attached — enough for connect, submit and snapshot flows." }

		{
			"id": "commit-funds",
			"name": "Commit funds into the head",
			"tagline": "An incremental deposit: draft on the node, sign locally, settle on L1.",
			"category": "lifecycle",
			"edges": ["app-consumer>bridge-core", "bridge-core>ws-connector", "ws-connector>hydra-rest", "app-consumer>app-wallet", "hydra-rest>cardano-l1", "ws-connector>hydra-ws", "ws-connector>payload-types", "bridge-core>snapshot-cache"],
			"steps": [
				{ "node": "app-consumer", "title": "Choose what to move in", "note": "Pick the L1 UTxOs to deposit, or supply a blueprint transaction when the commit needs a script witness." },
				{ "node": "bridge-core", "title": "Ask the node to draft it", "note": "bridge.commit(data) forwards straight to connector.submitter.commit — the bridge adds no logic here." },
				{ "node": "ws-connector", "title": "POST /commit", "note": "Sent on the node's HTTP port, not the socket, because the caller needs the drafted transaction back." },
				{ "node": "hydra-rest", "title": "Receive the draft", "note": "The node returns an unsigned deposit transaction as cborHex. It is not yet valid — it has no witnesses." },
				{ "node": "app-wallet", "title": "Sign the draft", "note": "signTx with the committing key. This is the point where custody stays on your side: the node never sees the key." },
				{ "node": "cardano-l1", "title": "Settle the deposit", "note": "POST /cardano-transaction relays the signed deposit to L1. The node observes it and starts the deposit period." },
				{ "node": "payload-types", "title": "Track it by tag", "note": "CommitRecorded → DepositActivated → CommitApproved → CommitFinalized arrive over the socket. A deposit that stalls stays listed in GET /commits." },

				{ "node": "bridge-core", "title": "Take the head's parameters", "note": "getProtocolParameters() returns what the node reports, which in most head configurations means zero fees." },

<script>
	;(function () {
		'use strict'

		const DATA = JSON.parse(document.getElementById('graph-data').textContent)
		const NODE = new Map(DATA.nodes.map(n => [n.id, n]))
		const EDGE = new Map(DATA.edges.map(e => [e.id, e]))

		const CANVAS = { w: 1460, h: 1000 }
		const $ = id => document.getElementById(id)

		/* ── which flows touch which node ─────────────────────── */
		const flowsByNode = new Map()
		DATA.flows.forEach(f => {
			new Set(f.steps.map(s => s.node)).forEach(id => {
				if (!flowsByNode.has(id)) flowsByNode.set(id, [])
				flowsByNode.get(id).push(f)
			})
		})

		/* ── header chips ─────────────────────────────────────── */
		$('chips').innerHTML = Object.entries(DATA.meta.packages)
			.map(([name, v]) => `<span class="chip">${name.replace('@hydra-sdk/', '')} <b>${v}</b></span>`)
			.join('')

		/* ── theme ────────────────────────────────────────────── */
		const themeBtn = $('themeBtn')
		themeBtn.addEventListener('click', () => {
			const root = document.documentElement
			const dark = root.getAttribute('data-theme')
				? root.getAttribute('data-theme') === 'dark'
				: matchMedia('(prefers-color-scheme: dark)').matches
			root.setAttribute('data-theme', dark ? 'light' : 'dark')
			redrawEdgeLabels()
		})

		/* ── render group panels ──────────────────────────────── */
		const SVGNS = 'http://www.w3.org/2000/svg'
		const svg = $('wires')
		svg.setAttribute('width', CANVAS.w)
		svg.setAttribute('height', CANVAS.h)
		$('world').style.width = CANVAS.w + 'px'
		$('world').style.height = CANVAS.h + 'px'

		const gGroups = $('layerGroups')
		DATA.groups.forEach(g => {
			const el = document.createElementNS(SVGNS, 'g')
			el.setAttribute('class', 'grp t-' + g.tier)
			const r = document.createElementNS(SVGNS, 'rect')
			r.setAttribute('x', g.layout.x)
			r.setAttribute('y', g.layout.y)
			r.setAttribute('width', g.layout.w)
			r.setAttribute('height', g.layout.h)
			r.setAttribute('rx', 14)
			el.appendChild(r)
			const t = document.createElementNS(SVGNS, 'text')
			t.setAttribute('class', 'grp-label')
			t.setAttribute('x', g.layout.x + 16)
			t.setAttribute('y', g.layout.y + 22)
			t.textContent = g.label
			el.appendChild(t)
			gGroups.appendChild(el)
			if (g.version) {
				const v = document.createElementNS(SVGNS, 'text')
				v.setAttribute('class', 'grp-ver')
				// Measured, not estimated — the label is set in a stack whose
				// metrics differ per platform.
				v.setAttribute('x', g.layout.x + 16 + t.getComputedTextLength() + 10)
				v.setAttribute('y', g.layout.y + 22)
				v.textContent = 'v' + g.version
				el.appendChild(v)
			}
		})

		/* ── render nodes ─────────────────────────────────────── */
		const layerNodes = $('layerNodes')
		const nodeEls = new Map()
		DATA.nodes.forEach(n => {
			const b = document.createElement('button')
			b.type = 'button'
			b.className = 'node t-' + n.tier
			b.dataset.id = n.id
			b.style.left = n.layout.x + 'px'
			b.style.top = n.layout.y + 'px'
			b.style.width = n.layout.w + 'px'
			b.style.height = n.layout.h + 'px'
			b.innerHTML =
				'<span class="stripe"></span><span class="txt">' +
				'<span class="lbl"></span><span class="sub"></span></span>' +
				'<span class="badge"></span>'
			b.querySelector('.lbl').textContent = n.label
			b.querySelector('.sub').textContent = n.sublabel
			layerNodes.appendChild(b)
			nodeEls.set(n.id, b)
		})

		/* ── edge geometry ────────────────────────────────────── */
		const rectOf = id => {
			const l = NODE.get(id).layout
			return { x: l.x, y: l.y, w: l.w, h: l.h, cx: l.x + l.w / 2, cy: l.y + l.h / 2 }
		}

		// Decide a side per endpoint, then spread the anchors that share a side
		// so parallel edges do not stack on one point.
		const plan = DATA.edges.map(e => {
			const a = rectOf(e.from)
			const b = rectOf(e.to)
			const dx = b.cx - a.cx
			const dy = b.cy - a.cy
			const horiz = Math.abs(dx) > Math.abs(dy) * 1.15
			return {
				edge: e,
				a,
				b,
				horiz,
				fromSide: horiz ? (dx > 0 ? 'r' : 'l') : dy > 0 ? 'b' : 't',
				toSide: horiz ? (dx > 0 ? 'l' : 'r') : dy > 0 ? 't' : 'b'
			}
		})

		const slots = new Map()
		const enrol = (nodeId, side, key, cross) => {
			const k = nodeId + side
			if (!slots.has(k)) slots.set(k, [])
			slots.get(k).push({ key, cross })
		}
		plan.forEach(p => {
			const horizFrom = p.fromSide === 'l' || p.fromSide === 'r'
			enrol(p.edge.from, p.fromSide, p.edge.id, horizFrom ? p.b.cy : p.b.cx)
			const horizTo = p.toSide === 'l' || p.toSide === 'r'
			enrol(p.edge.to, p.toSide, p.edge.id, horizTo ? p.a.cy : p.a.cx)
		})
		const slotIndex = new Map()
		slots.forEach((list, k) => {
			list.sort((m, n) => m.cross - n.cross)
			list.forEach((item, i) => slotIndex.set(k + '|' + item.key, { i, n: list.length }))
		})

		const anchor = (r, side, nodeId, edgeId) => {
			const s = slotIndex.get(nodeId + side + '|' + edgeId) || { i: 0, n: 1 }
			const t = (s.i + 1) / (s.n + 1)
			const spanX = r.w * 0.72
			const spanY = r.h * 0.6
			if (side === 'l') return { x: r.x, y: r.y + r.h / 2 + (t - 0.5) * spanY }
			if (side === 'r') return { x: r.x + r.w, y: r.y + r.h / 2 + (t - 0.5) * spanY }
			if (side === 't') return { x: r.x + r.w / 2 + (t - 0.5) * spanX, y: r.y }
			return { x: r.x + r.w / 2 + (t - 0.5) * spanX, y: r.y + r.h }
		}

		const gEdges = $('layerEdges')
		const gLabels = $('layerLabels')
		const edgeEls = new Map()
		const labelEls = new Map()

		plan.forEach(p => {
			const p1 = anchor(p.a, p.fromSide, p.edge.from, p.edge.id)
			const p2 = anchor(p.b, p.toSide, p.edge.to, p.edge.id)
			let d
			if (p.horiz) {
				const k = Math.max(44, Math.abs(p2.x - p1.x) * 0.42)
				const s1 = p.fromSide === 'r' ? k : -k
				const s2 = p.toSide === 'l' ? -k : k
				d = `M${p1.x},${p1.y} C${p1.x + s1},${p1.y} ${p2.x + s2},${p2.y} ${p2.x},${p2.y}`
			} else {
				const k = Math.max(30, Math.abs(p2.y - p1.y) * 0.5)
				const s1 = p.fromSide === 'b' ? k : -k
				const s2 = p.toSide === 't' ? -k : k
				d = `M${p1.x},${p1.y} C${p1.x},${p1.y + s1} ${p2.x},${p2.y + s2} ${p2.x},${p2.y}`
			}
			const path = document.createElementNS(SVGNS, 'path')
			path.setAttribute('class', 'edge k-' + (p.edge.kind || 'call'))
			path.setAttribute('d', d)
			path.setAttribute('marker-end', 'url(#ar)')
			gEdges.appendChild(path)
			edgeEls.set(p.edge.id, path)

			if (p.edge.label) {
				const mid = path.getPointAtLength(path.getTotalLength() / 2)
				// Wrapped in a <g> so the label can be counter-scaled against the
				// viewport zoom — 9.5px type would be unreadable at 0.6×.
				const g = document.createElementNS(SVGNS, 'g')
				g.dataset.x = mid.x
				g.dataset.y = mid.y - 6
				const t = document.createElementNS(SVGNS, 'text')
				t.setAttribute('class', 'elabel')
				t.textContent = p.edge.label
				g.appendChild(t)
				gLabels.appendChild(g)
				labelEls.set(p.edge.id, t)
			}
		})

		// Keep edge labels at a constant on-screen size, and repaint their halo
		// in the current stage colour when the theme flips.
		function redrawEdgeLabels() {
			const stageColor = getComputedStyle(document.documentElement).getPropertyValue('--stage').trim()
			const s = Math.min(1.8, Math.max(0.75, 1 / view.k))
			labelEls.forEach(t => {
				t.style.stroke = stageColor
				const g = t.parentNode
				g.setAttribute('transform', `translate(${g.dataset.x}, ${g.dataset.y}) scale(${s})`)
			})
		}

		/* ── pan & zoom ───────────────────────────────────────── */
		const viewport = $('viewport')
		const world = $('world')
		const view = { x: 0, y: 0, k: 1 }

		function applyView() {
			world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`
			redrawEdgeLabels()
		}
		function clampK(k) {
			return Math.min(2.2, Math.max(0.3, k))
		}
		function fit(animate) {
			const r = viewport.getBoundingClientRect()
			const pad = 34
			const k = clampK(Math.min((r.width - pad * 2) / CANVAS.w, (r.height - pad * 2) / CANVAS.h))
			view.k = k
			view.x = (r.width - CANVAS.w * k) / 2
			view.y = (r.height - CANVAS.h * k) / 2
			world.style.transition = animate ? 'transform 0.35s cubic-bezier(.22,.61,.36,1)' : 'none'
			applyView()
			if (animate) setTimeout(() => (world.style.transition = 'none'), 380)
		}
		function zoomAt(cx, cy, factor) {
			const k2 = clampK(view.k * factor)
			const s = k2 / view.k
			view.x = cx - (cx - view.x) * s
			view.y = cy - (cy - view.y) * s
			view.k = k2
			applyView()
		}
		function focusNode(id, animate) {
			const l = NODE.get(id).layout
			const r = viewport.getBoundingClientRect()
			const k = Math.max(view.k, 0.78)
			view.k = k
			view.x = r.width / 2 - (l.x + l.w / 2) * k
			view.y = r.height / 2 - (l.y + l.h / 2) * k
			world.style.transition = animate ? 'transform 0.4s cubic-bezier(.22,.61,.36,1)' : 'none'
			applyView()
			if (animate) setTimeout(() => (world.style.transition = 'none'), 440)
		}

		viewport.addEventListener(
			'wheel',
			ev => {
				ev.preventDefault()
				const r = viewport.getBoundingClientRect()
				zoomAt(ev.clientX - r.left, ev.clientY - r.top, Math.pow(0.999, ev.deltaY * 1.6))
			},
			{ passive: false }
		)

		let drag = null
		viewport.addEventListener('pointerdown', ev => {
			if (ev.target.closest('.node')) return
			drag = { px: ev.clientX, py: ev.clientY, x: view.x, y: view.y }
			viewport.classList.add('dragging')
			viewport.setPointerCapture(ev.pointerId)
		})
		viewport.addEventListener('pointermove', ev => {
			if (!drag) return
			view.x = drag.x + (ev.clientX - drag.px)
			view.y = drag.y + (ev.clientY - drag.py)
			applyView()
		})
		const endDrag = () => {
			drag = null
			viewport.classList.remove('dragging')
		}
		viewport.addEventListener('pointerup', endDrag)
		viewport.addEventListener('pointercancel', endDrag)

		$('zoomIn').addEventListener('click', () => {
			const r = viewport.getBoundingClientRect()
			zoomAt(r.width / 2, r.height / 2, 1.25)
		})
		$('zoomOut').addEventListener('click', () => {
			const r = viewport.getBoundingClientRect()
			zoomAt(r.width / 2, r.height / 2, 0.8)
		})
		$('zoomFit').addEventListener('click', () => fit(true))

		/* ── tooltip ──────────────────────────────────────────── */
		const tip = $('tip')
		let tipNode = null

		function showTip(id, cx, cy) {
			const n = NODE.get(id)
			const fl = flowsByNode.get(id) || []
			tip.className = 'tip on t-' + n.tier
			tip.innerHTML =
				'<div class="tip-top"><h4></h4><span class="tier"></span></div>' +
				'<code class="path"></code><p></p>' +
				(n.api && n.api.length ? '<ul></ul>' : '') +
				(fl.length ? '<div class="inflows"></div>' : '')
			tip.querySelector('h4').textContent = n.label
			tip.querySelector('.tier').textContent = n.tier
			tip.querySelector('.path').textContent = n.path
			tip.querySelector('p').textContent = n.desc
			if (n.api && n.api.length) {
				tip.querySelector('ul').innerHTML = n.api
					.map(a => '<li></li>')
					.join('')
				tip.querySelectorAll('ul li').forEach((li, i) => (li.textContent = n.api[i]))
			}
			if (fl.length) {
				const el = tip.querySelector('.inflows')
				el.innerHTML = 'Appears in <b></b> '
				el.querySelector('b').textContent = fl.length + (fl.length === 1 ? ' flow' : ' flows')
				el.append(document.createTextNode('— ' + fl.map(f => f.name).join(' · ')))
			}
			const r = tip.getBoundingClientRect()
			let x = cx + 18
			let y = cy + 16
			if (x + r.width > innerWidth - 12) x = cx - r.width - 18
			if (y + r.height > innerHeight - 12) y = Math.max(12, cy - r.height - 16)
			tip.style.left = Math.max(12, x) + 'px'
			tip.style.top = y + 'px'
			tipNode = id
		}
		function hideTip() {
			tip.classList.remove('on')
			tipNode = null
		}

		layerNodes.addEventListener('pointerover', ev => {
			const b = ev.target.closest('.node')
			if (!b || b.dataset.id === tipNode) return
			showTip(b.dataset.id, ev.clientX, ev.clientY)
		})
		layerNodes.addEventListener('pointermove', ev => {
			const b = ev.target.closest('.node')
			if (!b) return
			if (b.dataset.id !== tipNode) showTip(b.dataset.id, ev.clientX, ev.clientY)
		})
		layerNodes.addEventListener('pointerout', ev => {
			if (!ev.relatedTarget || !ev.relatedTarget.closest || !ev.relatedTarget.closest('.node')) hideTip()
		})
		layerNodes.addEventListener('focusin', ev => {
			const b = ev.target.closest('.node')
			if (!b) return
			const r = b.getBoundingClientRect()
			showTip(b.dataset.id, r.right, r.top)
		})
		layerNodes.addEventListener('focusout', hideTip)

		// Hovering a node also lifts the edges attached to it.
		layerNodes.addEventListener('pointerover', ev => {
			const b = ev.target.closest('.node')
			if (!b) return
			DATA.edges.forEach(e => {
				if (e.from === b.dataset.id || e.to === b.dataset.id) {
					edgeEls.get(e.id).classList.add('hovered')
					const l = labelEls.get(e.id)
					if (l) l.classList.add('shown')
				}
			})
		})
		layerNodes.addEventListener('pointerout', ev => {
			const b = ev.target.closest('.node')
			if (!b) return
			DATA.edges.forEach(e => {
				edgeEls.get(e.id).classList.remove('hovered')
				const l = labelEls.get(e.id)
				if (l && !edgeEls.get(e.id).classList.contains('on')) l.classList.remove('shown')
			})
		})

		/* ── flow state ───────────────────────────────────────── */
		const stage = $('stage')
		const rail = $('rail')
		let active = null
		let stepIx = 0

		function pathEdgesOf(flow) {
			const set = new Set(flow.edges || [])
			for (let i = 0; i < flow.steps.length - 1; i++) {
				const a = flow.steps[i].node
				const b = flow.steps[i + 1].node
				if (EDGE.has(a + '>' + b)) set.add(a + '>' + b)
				else if (EDGE.has(b + '>' + a)) set.add(b + '>' + a)
			}
			return set
		}

		function paint() {
			nodeEls.forEach(el => {
				el.classList.remove('on', 'cur', 'transit')
				el.querySelector('.badge').textContent = ''
			})
			edgeEls.forEach(el => {
				el.classList.remove('on')
				el.setAttribute('marker-end', 'url(#ar)')
			})
			labelEls.forEach(el => el.classList.remove('shown'))

			if (!active) {
				stage.classList.remove('flowing')
				$('stageNote').textContent = 'Hover a component · drag to pan · scroll to zoom'
				return
			}
			stage.classList.add('flowing')

			const order = new Map()
			active.steps.forEach((s, i) => {
				if (!order.has(s.node)) order.set(s.node, [])
				order.get(s.node).push(i + 1)
			})
			order.forEach((nums, id) => {
				const el = nodeEls.get(id)
				if (!el) return
				el.classList.add('on')
				el.querySelector('.badge').textContent = nums.join('·')
			})

			pathEdgesOf(active).forEach(eid => {
				const el = edgeEls.get(eid)
				if (!el) return
				el.classList.add('on')
				el.setAttribute('marker-end', 'url(#ar-hot)')
				const l = labelEls.get(eid)
				if (l) l.classList.add('shown')
				// Light the endpoints too, so a path never appears to run through
				// a box that is dimmed out.
				const e = EDGE.get(eid)
				;[e.from, e.to].forEach(id => {
					if (order.has(id)) return
					const nd = nodeEls.get(id)
					if (nd) nd.classList.add('on', 'transit')
				})
			})

			const cur = active.steps[stepIx]
			if (cur) nodeEls.get(cur.node).classList.add('cur')
			$('stageNote').textContent = active.name + ' · step ' + (stepIx + 1) + ' of ' + active.steps.length
		}

		/* ── rail: list view ──────────────────────────────────── */
		const CAT_ORDER = ['lifecycle', 'transaction', 'plutus', 'keys', 'state', 'recovery', 'architecture', 'performance']
		const CAT_LABEL = {
			lifecycle: 'Head lifecycle',
			transaction: 'Building transactions',
			plutus: 'Plutus',
			keys: 'Keys & wallets',
			state: 'State & caching',
			recovery: 'Recovery',
			architecture: 'Extension points',
			performance: 'Performance'
		}

		function renderList() {
			const cats = CAT_ORDER.filter(c => DATA.flows.some(f => f.category === c))
			const unknown = [...new Set(DATA.flows.map(f => f.category))].filter(c => !CAT_ORDER.includes(c))

			rail.innerHTML =
				'<div class="overview">' +
				'<div class="eyebrow">How to read this</div>' +
				'<p>Every box is a real module, service or endpoint in this repository, positioned inside the package that owns it. ' +
				'Colour marks the tier: who consumes, what ships on npm, where WASM begins, and what lives across the network. ' +
				'Pick a flow below and the map dims to just the path that flow takes.</p>' +
				'<div class="stats">' +
				`<div class="stat"><b>${DATA.nodes.length}</b><span>components</span></div>` +
				`<div class="stat"><b>${DATA.edges.length}</b><span>links</span></div>` +
				`<div class="stat"><b>${DATA.flows.length}</b><span>flows</span></div>` +
				'</div></div>' +
				'<div class="flow-head"><div class="eyebrow">Flows</div></div>' +
				cats
					.concat(unknown)
					.map(cat => {
						const items = DATA.flows.filter(f => f.category === cat)
						return (
							`<div class="cat-head">${CAT_LABEL[cat] || cat}</div><div class="flow-list">` +
							items
								.map(
									f =>
										`<button class="flow-card" type="button" data-flow="${f.id}">` +
										`<span class="fname">${esc(f.name)}</span>` +
										`<span class="ftag">${esc(f.tagline)}</span>` +
										`<span class="fmeta">${f.steps.length} steps · ${
											new Set(f.steps.map(s => NODE.get(s.node).group)).size
										} packages</span>` +
										'</button>'
								)
								.join('') +
							'</div>'
						)
					})
					.join('') +
				'<div class="hint">Tip: hover any box for its file path and public surface. Inside a flow, <kbd>←</kbd> <kbd>→</kbd> walk the steps and <kbd>Esc</kbd> returns here.</div>'
		}

		/* ── rail: detail view ────────────────────────────────── */
		function renderDetail() {
			const f = active
			rail.innerHTML =
				'<div class="detail"><div class="detail-head">' +
				'<button class="back" type="button" id="backBtn">← All flows</button>' +
				`<div class="eyebrow">${CAT_LABEL[f.category] || f.category}</div>` +
				`<h2>${esc(f.name)}</h2>` +
				`<p class="ftag">${esc(f.tagline)}</p>` +
				'<div class="stepper">' +
				`<span class="count">Step <b id="stepNo"></b> of ${f.steps.length}</span>` +
				'<button type="button" id="prevBtn" aria-label="Previous step">←</button>' +
				'<button type="button" id="nextBtn" aria-label="Next step">→</button>' +
				'</div></div>' +
				'<ol class="steps" id="stepList">' +
				f.steps
					.map((s, i) => {
						const n = NODE.get(s.node)
						return (
							`<li class="step-item t-${n.tier}" data-ix="${i}">` +
							'<button class="step-btn" type="button">' +
							`<span class="step-num">${i + 1}</span>` +
							`<span><span class="step-node">${esc(n.label)}</span>` +
							`<span class="step-title">${esc(s.title)}</span>` +
							`<span class="step-note">${esc(s.note)}</span></span>` +
							'</button></li>'
						)
					})
					.join('') +
				'</ol></div>'

			$('backBtn').addEventListener('click', () => closeFlow())
			$('prevBtn').addEventListener('click', () => goStep(stepIx - 1))
			$('nextBtn').addEventListener('click', () => goStep(stepIx + 1))
			$('stepList').addEventListener('click', ev => {
				const li = ev.target.closest('.step-item')
				if (li) goStep(Number(li.dataset.ix))
			})
			syncStepUi()
		}

		function syncStepUi(scroll) {
			const no = $('stepNo')
			if (!no) return
			no.textContent = stepIx + 1
			$('prevBtn').disabled = stepIx === 0
			$('nextBtn').disabled = stepIx === active.steps.length - 1
			document.querySelectorAll('.step-item').forEach(li => {
				li.classList.toggle('cur', Number(li.dataset.ix) === stepIx)
			})
			// Only chase the current step once the reader is actually stepping —
			// scrolling on open would hide the flow's own title.
			if (!scroll) return
			const cur = document.querySelector('.step-item.cur')
			if (cur) cur.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
		}

		function goStep(i) {
			if (!active) return
			stepIx = Math.max(0, Math.min(active.steps.length - 1, i))
			syncStepUi(true)
			paint()
			focusNode(active.steps[stepIx].node, true)
		}

		function openFlow(id) {
			active = DATA.flows.find(f => f.id === id)
			stepIx = 0
			hideTip()
			renderDetail()
			paint()
			fitFlow()
		}

		function closeFlow() {
			active = null
			renderList()
			paint()
			fit(true)
		}

		// Frame just the nodes this flow touches.
		function fitFlow() {
			const ids = [...new Set(active.steps.map(s => s.node))]
			let x1 = Infinity,
				y1 = Infinity,
				x2 = -Infinity,
				y2 = -Infinity
			ids.forEach(id => {
				const l = NODE.get(id).layout
				x1 = Math.min(x1, l.x)
				y1 = Math.min(y1, l.y)
				x2 = Math.max(x2, l.x + l.w)
				y2 = Math.max(y2, l.y + l.h)
			})
			const pad = 70
			const r = viewport.getBoundingClientRect()
			const k = clampK(Math.min((r.width - pad * 2) / (x2 - x1), (r.height - pad * 2) / (y2 - y1), 1.05))
			view.k = k
			view.x = r.width / 2 - ((x1 + x2) / 2) * k
			view.y = r.height / 2 - ((y1 + y2) / 2) * k
			world.style.transition = 'transform 0.45s cubic-bezier(.22,.61,.36,1)'
			applyView()
			setTimeout(() => (world.style.transition = 'none'), 480)
		}

		rail.addEventListener('click', ev => {
			const card = ev.target.closest('.flow-card')
			if (card) openFlow(card.dataset.flow)
		})

		// Clicking a node jumps to that step when it is on the active path,
		// otherwise it opens the first flow that uses it.
		layerNodes.addEventListener('click', ev => {
			const b = ev.target.closest('.node')
			if (!b) return
			const id = b.dataset.id
			if (active) {
				const ix = active.steps.findIndex(s => s.node === id)
				if (ix >= 0) return goStep(ix)
			}
			const fl = flowsByNode.get(id)
			if (fl && fl.length) openFlow(fl[0].id)
		})

		addEventListener('keydown', ev => {
			if (ev.key === 'Escape' && active) return closeFlow()
			if (!active) return
			if (ev.key === 'ArrowRight') {
				ev.preventDefault()
				goStep(stepIx + 1)
			}
			if (ev.key === 'ArrowLeft') {
				ev.preventDefault()
				goStep(stepIx - 1)
			}
		})

		function esc(s) {
			return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
		}

		let rt
		addEventListener('resize', () => {
			clearTimeout(rt)
			rt = setTimeout(() => (active ? fitFlow() : fit(false)), 140)
		})

		renderList()
		redrawEdgeLabels()
		fit(false)
	})()
</script>
